<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kimmy Phone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    
    .phone-container { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; background: #000; }
    .dynamic-island { width: 120px; height: 32px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; }
    .status-bar { width: 100%; height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; font-size: 14px; font-weight: 600; position: absolute; top: 0; left: 0; z-index: 999; }
    
    .screen { flex: 1; position: relative; overflow: hidden; }

    /* LOCKSCREEN */
    #lock-main {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('kimmy1.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 80px 20px 50px; z-index: 80; cursor: pointer;
    }
    .lock-time { font-size: 72px; font-weight: 200; text-align: center; text-shadow: 0 3px 10px rgba(0,0,0,0.8); }
    .lock-date { font-size: 18px; text-align: center; margin-top: -10px; }
    .swipe-hint { text-align: center; font-size: 14px; animation: bounce 1.5s infinite; }

    /* PASSCODE */
    #passcode-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 60px 20px 50px; z-index: 85; transform: translateY(100%); transition: transform 0.3s ease;
