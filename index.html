<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kimmy JKT48 Phone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #000; color: #fff; overflow: hidden; position: fixed; }
    
    /* Full Screen Interface (Tanpa Bingkai Luar) */
    .phone-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #000;
    }
    
    /* Dynamic Island */
    .dynamic-island {
      width: 120px; height: 32px; background-color: #000;
      border-radius: 20px; z-index: 1000;
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      pointer-events: none;
    }

    /* iOS Status Bar */
    .status-bar {
      width: 100%; height: 48px; display: flex; justify-content: space-between;
      align-items: center; padding: 0 28px; font-size: 14px; font-weight: 600; z-index: 999;
      position: absolute; top: 0; left: 0; pointer-events: none;
    }
    
    .screen { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }

    /* LOCKSCREEN (kimmy1.jpg) */
    #lock-main {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('kimmy1.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 80px 20px 50px; z-index: 80; cursor: pointer; transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
