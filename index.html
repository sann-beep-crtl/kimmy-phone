<!DOCTYPE html>

  <title>Kimmy JKT48 iPhone 17 Pro Max</title>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* Frame iPhone 17 Pro Max Presisi */
    .phone-frame {
      width: 360px;
      height: 730px;
      background-color: #000;
      border: 10px solid #2c2c2e;
      border-radius: 50px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
    }
    
    /* Dynamic Island iOS */
    .dynamic-island {
      width: 115px; height: 30px; background-color: #000;
      border-radius: 20px; z-index: 1000;
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      pointer-events: none;
    }

    /* iOS Status Bar */
    .status-bar {
      width: 100%; height: 42px; display: flex; justify-content: space-between;
      align-items: center; padding: 0 25px; font-size: 12px; font-weight: 600; z-index: 999;
      position: absolute; top: 0; left: 0; pointer-events: none;
    }
    
    .screen { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }

    /* LOCKSCREEN UTAMA (Foto Kimmy Baret - kimmy1.jpg) */
    #lock-main {

      background: url('kimmy1.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 65px 20px 40px; z-index: 80; cursor: pointer; transition: transform 0.4s ease;
    }
    
    .lock-time { font-size: 68px; font-weight: 200; text-shadow: 0 3px 12px rgba(0,0,0,0.8); letter-spacing: -2px; text-align: center; }
    .lock-date { font-size: 16px; font-weight: 500; opacity: 0.95; text-align: center; margin-top: -10px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .swipe-hint { text-align: center; font-size: 13px; font-weight: 500; opacity: 0.9; animation: bounce 1.5s infinite; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
