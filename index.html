<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kimmy Phone - iPhone 17 Pro Max</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    /* FRAME IPHONE 17 PRO MAX */
    .phone-frame {
      width: 360px;
      height: 730px;
      background-color: #000;
      border: 10px solid #2c2c2e;
      border-radius: 50px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
    }

    .dynamic-island { width: 115px; height: 30px; background: #000; border-radius: 20px; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none; }
    .status-bar { width: 100%; height: 42px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; font-size: 12px; font-weight: 600; position: absolute; top: 0; left: 0; z-index: 999; pointer-events: none; }
    
    .screen { flex: 1; position: relative; overflow: hidden; background: #111; display: flex; flex-direction: column; }

    /* LOCKSCREEN - FOTO KIMMY 1 */
    #lock-main {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('kimmy1.jpeg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 65px 20px 40px; z-index: 80; cursor: pointer; transition: transform 0.4s ease;
    }
    .lock-time { font-size: 68px; font-weight: 200; text-align: center; text-shadow: 0 3px 12px rgba(0,0,0,0.9); letter-spacing: -2px; }
    .lock-date { font-size: 16px; text-align: center; margin-top: -10px; font-weight: 500; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .swipe-hint { text-align: center; font-size: 13px; animation: bounce 1.5s infinite; font-weight: 500; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

    /* PASSCODE (080310) */
    #passcode-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 60px 20px 40px; z-index: 85; transform: translateY(100%); transition: transform 0.3s ease;
    }
    .pass-dots { display: flex; gap: 14px; margin-bottom: 25px; }
    .dot { width: 13px; height: 13px; border: 2px solid #fff; border-radius: 50%; }
    .dot.active { background: #fff; }
